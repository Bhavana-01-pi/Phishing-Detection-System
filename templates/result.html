<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Result | PhishDetector</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --safe: #10b981;
            --phish: #ef4444;
            --warn: #f59e0b;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .results-container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-back {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }
        .nav-back:hover { color: var(--accent); }

        h2 { font-weight: 700; margin-bottom: 10px; }
        
        .url-checked {
            font-size: 14px;
            color: var(--text-muted);
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            word-break: break-all;
            margin-bottom: 30px;
            display: inline-block;
        }

        /* BANNER STYLES */
        .banner {
            padding: 20px;
            border-radius: 12px;
            font-size: 28px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .banner-safe { 
            background: linear-gradient(135deg, #10b981, #059669); 
            text-shadow: 0 2px 10px rgba(16, 185, 129, 0.5);
        }
        .banner-suspicious { 
            background: linear-gradient(135deg, #f59e0b, #d97706); 
            color: #fff;
        }
        .banner-phishing { 
            background: linear-gradient(135deg, #ef4444, #b91c1c); 
            text-shadow: 0 2px 10px rgba(239, 68, 68, 0.5);
        }

        /* SCORE CIRCLE */
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 8px solid rgba(255,255,255,0.1);
            margin: 0 auto 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .score-val {
            font-size: 48px;
            font-weight: 800;
            line-height: 1;
        }
        .score-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* LIST */
        .breakdown { text-align: left; }
        .breakdown h3 {
            font-size: 18px;
            color: var(--accent);
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .breakdown ul { list-style: none; padding: 0; }
        .breakdown li {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .breakdown li:last-child { border-bottom: none; }

        /* BUTTON */
        .report-button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            background: var(--accent);
            color: #0f172a;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .report-button:hover {
            background: #0891b2;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(6, 182, 212, 0.3);
        }
    </style>
</head>
<body>

    <div class="results-container">
        <a href="/" class="nav-back"><i class="fas fa-arrow-left"></i> Scan Another URL</a>
        
        <h2>Analysis Complete</h2>
        <div class="url-checked">{{ url }}</div>

        <div class="banner {{ verdict_class }}">
            {{ verdict }}
        </div>
        
        <div style="margin: 20px 0; text-align: center;">
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 8px;">Live Screenshot Captured by Bot:</p>
            <img src="{{ url_for('static', filename='screenshot.png') }}?v={{ cache_buster }}" 
                 style="max-width: 100%; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 5px 15px rgba(0,0,0,0.3);"
                 alt="Live Scan Evidence">
        </div>

        <div class="score-circle">
            <div class="score-val">{{ risk_score }}</div>
            <div class="score-label">Risk Score</div>
        </div>
        
        <div class="breakdown">
            <h3>Quick Summary</h3>
            <ul>
                {% for item in breakdown_data %}
                    <li>
                        {{ item.message }}
                    </li>
                {% endfor %}
            </ul>
        </div>

        <a href="{{ url_for('report', url=url) }}" class="report-button">
            View Full Forensic Report <i class="fas fa-file-alt"></i>
        </a>
    </div>

</body>
</html>
